apiVersion: apps/v1
kind: Deployment
metadata:
  name: circuit-cards
  namespace: q-personal
  labels:
    app: circuit-cards
    part: rocket
spec:
  replicas: 1
  selector:
    matchLabels:
      app: circuit-cards
      part: rocket
  template:
    metadata:
      annotations:
         cni.projectcalico.org/ipv6pools: "[\"default-ipv6-ippool\"]"
      labels:
        app: circuit-cards
        part: rocket
    spec:
      containers:
        - name: circuit-cards
          image: theenbyperor/circuit-cards:3
          env:
            - name: ROCKET_ADDRESS
              value: "::"
          ports:
            - containerPort: 8000
---
apiVersion: v1
kind: Service
metadata:
  name: circuit-cards
  namespace: q-personal
  labels:
    app: circuit-cards
    part: rocket
spec:
  selector:
    app: circuit-cards
    part: rocket
  ports:
    - port: 8000
      targetPort: 8000
      name: rocket
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: circuit-cards
  namespace: q-personal
  annotations:
    nginx.ingress.kubernetes.io/proxy-body-size: "0"
    cert-manager.io/cluster-issuer: letsencrypt
spec:
  tls:
    - hosts:
        - circuit-cards.magicalcodewit.ch
      secretName: circuit-cards-tls
  rules:
  - host: circuit-cards.magicalcodewit.ch
    http: &http
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: circuit-cards
            port:
              number: 8000
